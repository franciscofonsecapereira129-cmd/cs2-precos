name: collect
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests brotli
      - run: python collector.py
      - run: |
          git config user.name "collector"
          git config user.email "collector@users.noreply.github.com"
          git add data/prices.csv
          git diff --cached --quiet || (git commit -m "prices $(date -u +%FT%TZ)" && git push)
